name: Release

# Publishes a signed, notarized update only for a version tag or a manual run.
# Pushes and pull requests do not publish a release. See docs/UPDATES.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Sign, notarize, and publish
    runs-on: macos-15
    if: github.event.repository.fork == false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Refuse a release that is not on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Validate the version, feed, and public key
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          UPDATE_FEED_URL: ${{ vars.DESKTOP_STUDIO_UPDATE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.DESKTOP_STUDIO_SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts/release")
          from release_rules import (
              assert_app_version_constants,
              assert_build_is_newer,
              assert_feed_url,
              assert_public_key,
              assert_tag_matches_project,
              read_project_versions,
          )
          tag = os.environ["RELEASE_TAG"]
          project = open("DesktopStudio.xcodeproj/project.pbxproj", encoding="utf-8").read()
          version, build = read_project_versions(project)
          swift = open("DesktopStudio/App/AppVersion.swift", encoding="utf-8").read()
          assert_tag_matches_project(tag, version)
          assert_app_version_constants(swift, version, build)
          assert_feed_url(os.environ["UPDATE_FEED_URL"])
          assert_public_key(os.environ["SPARKLE_PUBLIC_ED_KEY"])
          previous = []
          tags = subprocess.check_output(["git", "tag", "-l", "v*"], text=True).split()
          for earlier in tags:
              if earlier == tag:
                  continue
              try:
                  text = subprocess.check_output(
                      ["git", "show", f"{earlier}:DesktopStudio.xcodeproj/project.pbxproj"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              _, earlier_build = read_project_versions(text)
              previous.append(earlier_build)
          assert_build_is_newer(build, previous)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MARKETING_VERSION={version}\nCURRENT_PROJECT_VERSION={build}\nRELEASE_TAG={tag}\n")
          print(f"Validated {tag} as {version} build {build}")
          PY

      - name: Require signing and notarization secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_TEAM_ID DEVELOPER_ID_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY SPARKLE_EDDSA_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build and test before signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project DesktopStudio.xcodeproj \
            -scheme DesktopStudio \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test

      - name: Import the Developer ID certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/desktop-studio-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          PROFILE_PATH="$RUNNER_TEMP/developer-id.provisionprofile"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.provisionprofile"
          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROVISIONING_PROFILE_UUID=$UUID"
          } >> "$GITHUB_ENV"

      - name: Archive and export a Developer ID app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_FEED_URL: ${{ vars.DESKTOP_STUDIO_UPDATE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.DESKTOP_STUDIO_SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity was imported."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          xcodebuild \
            -project DesktopStudio.xcodeproj \
            -scheme DesktopStudio \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/DesktopStudio.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            DESKTOP_STUDIO_UPDATE_FEED_URL="$UPDATE_FEED_URL" \
            DESKTOP_STUDIO_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.desktopstudio.app</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DesktopStudio.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_PLIST"
          test -d "$RUNNER_TEMP/export/Desktop Studio.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Desktop Studio.app"

      - name: Notarize and staple
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Desktop Studio.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --wait
          rm -f "$KEY_PATH"
          xcrun stapler staple "$RUNNER_TEMP/export/Desktop Studio.app"
          xcrun stapler validate "$RUNNER_TEMP/export/Desktop Studio.app"
          rm -f "$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Desktop Studio.app" "$RUNNER_TEMP/DesktopStudio-${MARKETING_VERSION}.zip"

      - name: Sign the archive with the pinned Sparkle 2.10.0 tool
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
          curl --fail --location --silent --show-error \
            --output "$SPARKLE_ARCHIVE" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $SPARKLE_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$RUNNER_TEMP/sparkle-tools"
          SIGN_UPDATE="$(find "$RUNNER_TEMP/sparkle-tools" -type f -name sign_update | head -n 1)"
          test -x "$SIGN_UPDATE"
          KEY_PATH="$RUNNER_TEMP/sparkle-eddsa.key"
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          set +e
          "$SIGN_UPDATE" --ed-key-file "$KEY_PATH" "$RUNNER_TEMP/DesktopStudio-${MARKETING_VERSION}.zip" > "$RUNNER_TEMP/sign-update.txt"
          STATUS=$?
          set -e
          rm -f "$KEY_PATH"
          if [ "$STATUS" -ne 0 ]; then
            echo "sign_update failed."
            exit "$STATUS"
          fi
          echo "Sparkle signed the archive."

      - name: Publish the GitHub release and appcast
        env:
          UPDATE_FEED_URL: ${{ vars.DESKTOP_STUDIO_UPDATE_FEED_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to replace it."
            exit 1
          fi
          ARCHIVE="$RUNNER_TEMP/DesktopStudio-${MARKETING_VERSION}.zip"
          gh release create "$RELEASE_TAG" "$ARCHIVE#DesktopStudio-${MARKETING_VERSION}.zip" \
            --title "Desktop Studio ${MARKETING_VERSION}" \
            --notes "Desktop Studio ${MARKETING_VERSION} (build ${CURRENT_PROJECT_VERSION}). Install the zip, or let an older signed copy update through Sparkle." \
            --verify-tag
          EXISTING="$RUNNER_TEMP/existing-appcast.xml"
          git fetch origin gh-pages || true
          if git rev-parse --verify --quiet refs/remotes/origin/gh-pages >/dev/null; then
            git show "origin/gh-pages:appcast.xml" > "$EXISTING" || : > "$EXISTING"
          else
            : > "$EXISTING"
          fi
          MARKETING_VERSION="$MARKETING_VERSION" \
          CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
          RELEASE_TAG="$RELEASE_TAG" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          SIGN_OUTPUT_PATH="$RUNNER_TEMP/sign-update.txt" \
          EXISTING_APPCAST="$EXISTING" \
          APPCAST_OUTPUT="$RUNNER_TEMP/appcast.xml" \
          python3 scripts/release/write_appcast.py
          bash scripts/release/push_appcast.sh "$RUNNER_TEMP/appcast.xml"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/DesktopStudio-${MARKETING_VERSION}.zip"
          echo "Feed: $UPDATE_FEED_URL"

      - name: Remove temporary signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/sparkle-eddsa.key" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sign-update.txt" || true
