name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check release rules
        run: python3 -m unittest test_release_rules.py
        working-directory: scripts/release

      - name: Build and test, including theme validation
        run: |
          xcodebuild \
            -project DesktopStudio.xcodeproj \
            -scheme DesktopStudio \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test
